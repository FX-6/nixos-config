# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

########
# Config
########

# Insert a blank line between prompts
add_newline = true

# Display command duration
[cmd_duration]
min_time = 500
show_milliseconds = true
format = "[$duration]()"

# git status
[git_status]
format = '([\[$conflicted$stashed$untracked$modified$renamed$deleted$typechanged$staged$ahead_behind\]]($style) )'
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
renamed = "»${count}"
deleted = "×${count}"
untracked = "?${count}"
modified = "~${count}"
staged = "+${count}"

# Display OS
[os]
disabled = false

# Display Shell
[shell]
disabled = false

###############
# Disable stuff
###############

[package]
disabled = true
symbol = "󰏗 "

[aws]
disabled = true
symbol = "  "

